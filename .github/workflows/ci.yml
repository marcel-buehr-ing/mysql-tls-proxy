name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Test and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting and whitespace
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          git show --format= --check HEAD
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build scratch image
        run: docker build --platform linux/amd64 --tag mysql-tls-proxy:ci .
      - name: Check container startup
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' mysql-tls-proxy:ci)" = '65532:65532'
          docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges mysql-tls-proxy:ci --help
          if docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges mysql-tls-proxy:ci; then
            echo 'Container accepted missing configuration.' >&2
            exit 1
          fi

  publish:
    name: Publish versioned image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.' >&2
            exit 1
          fi
          printf 'IMAGE=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build release image
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" .
          docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges "$IMAGE" --help
      - name: Publish to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf 'Published %s for Linux/amd64.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
