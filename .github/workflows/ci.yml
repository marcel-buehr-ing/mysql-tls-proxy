name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting and whitespace
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          git show --format= --check HEAD
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build scratch image
        run: docker build --platform "linux/$ARCH" --tag mysql-tls-proxy:ci .
      - name: Check container startup
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mysql-tls-proxy:ci)" = "linux/$ARCH"
          test "$(docker image inspect --format '{{.Config.User}}' mysql-tls-proxy:ci)" = '65532:65532'
          docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges mysql-tls-proxy:ci --help
          if docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges mysql-tls-proxy:ci; then
            echo 'Container accepted missing configuration.' >&2
            exit 1
          fi

  publish:
    name: Publish image (${{ matrix.arch }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.' >&2
            exit 1
          fi
          printf 'IMAGE=ghcr.io/%s:%s-%s\n' "${GITHUB_REPOSITORY,,}" "${RELEASE_TAG#v}" "$ARCH" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build release image
        run: |
          docker build --platform "linux/$ARCH" --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"
          docker run --rm --read-only --network none --cap-drop=ALL \
            --security-opt=no-new-privileges "$IMAGE" --help
      - name: Publish to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf 'Published %s for linux/%s.\n' "$IMAGE" "$ARCH" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Publish multi-platform image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Assemble and publish image index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --dry-run \
            "$image-amd64" "$image-arm64" > "$RUNNER_TEMP/manifest.json"
          jq -e '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create --tag "$image" \
            "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
          printf 'Published %s for linux/amd64 and linux/arm64.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
